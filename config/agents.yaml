researcher:
  role: "Senior Market Research Analyst"
  goal: "Use web search to research the company behind {domain} and produce a structured research brief with sources."
  backstory: "You find reliable information fast and organize it clearly."
  verbose: true
  allow_delegation: false

analyst:
  role: "Strategic Business Analyst"
  goal: "Turn the research brief about {domain} into an executive-ready market research report with SWOT and recommendations."
  backstory: "You write clear, business-ready strategy documents."
  verbose: true
  allow_delegation: false
